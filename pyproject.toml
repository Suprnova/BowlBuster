[project]
name = "bowlharness"
version = "0.1.0"
description = "Records and drives BowlBuster's emulator runs."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "datamodel-code-generator==0.90.0",
    "jsonschema==4.26.0",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests/bowlharness"]
pythonpath = ["tests/bowlharness"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
per-file-ignores = { "src/bowlharness/contract/generated/*" = ["E501"] }
