# The names BowlBuster prints and accepts for costumes, levels, worlds and task slots.
#
# Adding or changing a name
#   Edit this file, then run `dotnet test`. The repository catalog test reads this file and fails with every problem it
#   finds, each naming the entry it is about. Names are knowledge; game files and game data never belong here.
#
# costumes   Keyed by the printed name.
#              character  spongebob or patrick. Required.
#              archive    The tag of the player archive the costume loads, four upper-case letters or digits, as a
#                         recording names it. Optional, and never shared.
#              aliases    Other names a chain may use, such as an abbreviation.
#
# levels     Keyed by scene tag: four upper-case letters or digits. The tag is always accepted in a chain.
#              name       The community name. Optional; a level without one prints its tag.
#              aliases    Other names a chain may use.
#            A level with nothing but its tag is left out. Every name and alias resolves to the level's scene, so two
#            levels never share one, and no name is another level's tag (compared without case).
#
# worlds     Keyed by the world's number in the pause menu, from 1. Worlds 13 and 20 are left out: no menu slot reaches them.
#              name       The community name.
#              game       The text the game shows, copied verbatim, spacing and capitals included.
#              tasks      Keyed by slot number, from 1; each holds a name and a game text of its own. A task's name
#                         is the part after the world's: "Time" for "Weenie Time".
#            A world or task has at least one of name and game, and takes no aliases: a chain names scenes, and nothing
#            reads a world or a task as input. World names are unique, and so are the task names within a world; game
#            texts repeat ("Time Challenge" is in many worlds). A task's scene is not stored here: the pause menu
#            decides it.
#
# Printing
#   A level prints its community name; without one, its game text; with neither, its tag.
#   A world prints its community name, or else its game text.
#   A task prints its world's name followed by its own ("Weenie Time"). A task named like its world prints just that
#   name ("Frogfish"), so a world's only task is named after the world. A task with no community name prints its
#   game text as it is.
#
# Community names
#   A world has a short name (Weenie, NTWM, SCDA). A world with two main scenes names them "<world> 1" and
#   "<world> 2"; a world with one names it after the world. Challenge scenes are "<world> <word>". A task is named by
#   a word or two: Main, Time, Ring, Macho, Guitar, FB, Spongeball, Bungee, Combat, or what the task is about
#   (Bounce, Creek, Ice Skating).
#
# A level or costume name must be writable in a chain: it can't contain > , ( ) [ ], end in " x" and a number, begin
# with the word "burn", or be "non-SB". Keys are camel case, and a key the file doesn't use is an error.

